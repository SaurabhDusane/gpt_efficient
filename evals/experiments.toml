# Eval experiments: each is config.toml + these overrides (nested tables merge key
# by key). Every experiment sets router.type and cache.enabled explicitly so the
# base config can't leak in. Run a subset with: gpte eval --only fixed-mid,heuristic
#
# Cost notes: anything that can reach the "frontier" tier (fixed-frontier, and the
# heuristic router under tier_mode "three") calls gemini-3.1-pro-preview, which
# needs paid billing. The "-two" variants stay on free-tier models.

[[experiment]]
name = "fixed-local"
description = "Always the budget tier (Flash-Lite), no cache"
[experiment.overrides]
default_tier = "local"
router = { type = "fixed" }
cache = { enabled = false }

[[experiment]]
name = "fixed-mid"
description = "Always the mid tier (Flash), no cache: the pre-router baseline"
[experiment.overrides]
default_tier = "mid"
router = { type = "fixed" }
cache = { enabled = false }

[[experiment]]
name = "fixed-frontier"
description = "Always the frontier tier (Pro), no cache: the quality ceiling (paid)"
[experiment.overrides]
default_tier = "frontier"
router = { type = "fixed" }
cache = { enabled = false }

[[experiment]]
name = "heuristic"
description = "Heuristic router over three tiers, no cache"
[experiment.overrides]
tier_mode = "three"
router = { type = "heuristic" }
cache = { enabled = false }

[[experiment]]
name = "heuristic-two"
description = "Heuristic router over the free-tier pair (Flash-Lite + Flash), no cache"
[experiment.overrides]
tier_mode = "two"
router = { type = "heuristic" }
cache = { enabled = false }

[[experiment]]
name = "fixed-mid+cache"
description = "Fixed mid tier with the semantic cache"
[experiment.overrides]
default_tier = "mid"
router = { type = "fixed" }
cache = { enabled = true }

[[experiment]]
name = "heuristic+cache"
description = "Heuristic router over three tiers with the semantic cache"
[experiment.overrides]
tier_mode = "three"
router = { type = "heuristic" }
cache = { enabled = true }
