# gpt_efficient experiment config. Changing a value here + re-running = one experiment.
# Prices verified against https://ai.google.dev/gemini-api/docs/pricing (2026-09-23),
# Standard paid tier, text input.

default_provider = "gemini"
# No router yet (milestone 4): every query goes to this tier.
default_tier = "mid"
system_prompt = "You are a helpful assistant. Answer accurately and concisely."
max_tokens = 1024  # on thinking models this also caps thinking tokens
trace_db = "data/traces.db"

# Active tier set. "two" = budget + mid (both on Gemini's free tier).
# "three" adds the Pro frontier tier, which needs paid billing.
tier_mode = "three"

# Embeddings (semantic cache, learned router, compressor retrieval).
# embedding_provider defaults to default_provider.
embedding_model = "gemini-embedding-2"
embedding_price_per_mtok = 0.20  # text input
embedding_dim = 768  # model default is 3072; truncated dims are auto-normalized
# Gemini's embed API reports no token counts; trace embed_tokens is chars / this.
embedding_chars_per_token = 4.0

# Semantic cache (milestone 3). Queries with conversation history bypass it.
[cache]
enabled = true
threshold = 0.95  # cosine similarity for a hit; sweep this in the harness
db = "data/cache.db"
embed_template = "{text}"  # raw query; a task-prefix variant is a later experiment
version = "1"  # bump to invalidate all cached answers

# Router (milestone 4). "fixed" = always default_tier (the pre-router baseline);
# "heuristic" = length + complexity keywords + code/math presence -> tier.
[router]
type = "heuristic"

# Untuned baseline weights: the learned router (milestone 7) has to beat this.
[router.heuristic]
long_query_words = 40
very_long_query_words = 150
length_points = 1.0          # per length threshold crossed
keyword_points = 1.0         # per distinct keyword (plurals match too)
max_keyword_points = 2.0
code_points = 2.0
math_points = 2.0
keywords = [
    "prove", "proof", "derive", "derivation", "analyze", "analyse", "compare",
    "contrast", "design", "architecture", "optimize", "optimise", "debug",
    "refactor", "trade-off", "tradeoff", "step by step", "explain why",
    "in depth", "algorithm", "complexity", "rigorous", "formally",
]

# Minimum score per tier; the cheapest active tier is the floor. In tier_mode
# "two", scores above the mid cutoff stay on mid.
[router.heuristic.tier_cutoffs]
mid = 1.0
frontier = 3.0

# Eval harness (milestone 5). The judge only grades; it never answers queries.
[judge]
model = "gemini-2.5-pro"  # not in the answer ladder, so no model grades itself
max_tokens = 4096         # 2.5 Pro thinks before the verdict; thinking counts here
temperature = 0.0         # deterministic grading

[eval]
dataset = "evals/seed.jsonl"
experiments = "evals/experiments.toml"
out_dir = "results"
max_retries = 2          # per request, for transient errors (rate limits)
retry_backoff_s = 5.0    # doubles each retry
request_delay_s = 0.0    # raise this on the free tier to stay under RPM limits
low_quality = 0.5        # cache hit with quality below this = wrong hit

[tier_modes]
two = ["local", "mid"]
three = ["local", "mid", "frontier"]

# Tier -> model. `provider` defaults to default_provider when omitted.
# "local" is the budget tier; it moves to an Ollama model once that adapter exists.
[tiers.local]
model = "gemini-2.5-flash-lite"

[tiers.mid]
model = "gemini-2.5-flash"

[tiers.frontier]
model = "gemini-3.1-pro-preview"

# USD per million tokens. Output prices include thinking tokens.
[pricing."gemini-2.5-flash-lite"]
input_per_mtok = 0.10
output_per_mtok = 0.40

[pricing."gemini-2.5-flash"]
input_per_mtok = 0.30
output_per_mtok = 2.50

[pricing."gemini-3.1-pro-preview"]
input_per_mtok = 2.00
output_per_mtok = 12.00
long_context_threshold = 200000
input_per_mtok_long = 4.00
output_per_mtok_long = 18.00

# Judge model.
[pricing."gemini-2.5-pro"]
input_per_mtok = 1.25
output_per_mtok = 10.00
long_context_threshold = 200000
input_per_mtok_long = 2.50
output_per_mtok_long = 15.00

# Anthropic adapter is kept for when keys arrive (deferred, see SPEC §7).
[pricing."claude-haiku-4-5"]
input_per_mtok = 1.00
output_per_mtok = 5.00

[pricing."claude-sonnet-5"]
input_per_mtok = 2.00
output_per_mtok = 10.00

[pricing."claude-opus-5"]
input_per_mtok = 5.00
output_per_mtok = 25.00
